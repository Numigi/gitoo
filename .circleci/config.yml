version: 2.0

requirements: &requirements
  name: Install requirements
  command: |
    pip install pipenv
    pip install "setuptools_scm[toml]>=8.0" vcs-versioning
    pipenv install -e .
    pipenv install pytest pytest-cov pytest-random-order mock

git_config: &git_config
  name: Git Configuration
  command: |
    git config --global user.email "root@localhost"
    git config --global user.name "gitoo"

run_tests: &run_tests
  name: Run tests
  command: pipenv run pytest src/gitoo/tests/ -v -m "not slow" --cov=gitoo --cov-report=xml --cov-report=term

coverage_report: &coverage_report
  name: Coverage report
  command: |
    pipenv install coverage
    pipenv run coverage report -m

coverage_report_codacy: &coverage_report_codacy
  name: Codacy Coverage
  command: bash <(curl -Ls https://coverage.codacy.com/get.sh) report -l python -r ./coverage.xml

rm_virtualenv: &rm_virtualenv
  name: Remove Virtualenv
  command: pipenv --rm

run_cli: &run_cli
  name: Installation
  command: |
    pip install .
    gitoo --version

# broken with pip 10
# https://github.com/pypa/pipenv/issues/1996
pipenv_check: &pipenv_check
  name: Check for security vulnerabilities
  command: pipenv audit || true

jobs:
  python3:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          <<: *requirements
      - run:
          <<: *pipenv_check
      - run:
          <<: *git_config
      - run:
          <<: *run_tests
      - run:
          <<: *coverage_report_codacy
      - run:
          <<: *rm_virtualenv
      - run:
          <<: *run_cli

  deploy:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          <<: *requirements
      - run:
          name: Init .pypirc
          command: |
            echo -e "[pypi]" >> ~/.pypirc
            echo -e "username = $PYPI_USERNAME" >> ~/.pypirc
            echo -e "password = $PYPI_PASSWORD" >> ~/.pypirc

      - run:
          name: Make Package
          command: python setup.py sdist bdist_wheel

      - run:
          name: Upload to Pypi using Twine
          command: |
            pipenv install twine
            pipenv run twine upload dist/*

  docker-build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.18
      - run:
          name: Build Docker image
          command: |
            TAG_VERSION=${CIRCLE_TAG}
            docker build -t quay.io/numigi/gitoo:${TAG_VERSION} .
            docker tag quay.io/numigi/gitoo:${TAG_VERSION} quay.io/numigi/gitoo:latest
      - run:
          name: Push to Quay.io
          command: |
            echo "$QUAY_PASSWORD" | docker login quay.io -u "$QUAY_USERNAME" --password-stdin
            TAG_VERSION=${CIRCLE_TAG}
            docker push quay.io/numigi/gitoo:${TAG_VERSION}
            docker push quay.io/numigi/gitoo:latest

workflows:
  version: 2
  build:
    jobs:
      - python3:
          filters:
            tags:
              only: /.*/
      - deploy:
          requires:
            - python3
          filters:
            tags:
              only: /[0-9]+(\.[0-9]+)*/
            branches:
              ignore: /.*/
      - docker-build:
          requires:
            - python3
          filters:
            tags:
              only: /[0-9]+(\.[0-9]+)*/
            branches:
              ignore: /.*/
